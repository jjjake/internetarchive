name: tox
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tox:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', 'pypy-3.11']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs reads the version from git tags
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          enable-cache: true
      # Install tox into the matrix interpreter so `tox -e py` targets it;
      # tox-uv makes tox build its test envs with uv. The versions come from
      # uv.lock's `tox` group (exported with hashes) rather than an unpinned
      # install, so this step cannot drift between legs or runs.
      - run: uv export --locked --only-group tox --no-emit-project -o tox-requirements.txt
      - run: uv pip install --system --require-hashes -r tox-requirements.txt
      # Live-network tests (marker: network) are excluded in CI; run them
      # locally with plain `pytest`.
      - run: tox -e py -- -m "not network"
