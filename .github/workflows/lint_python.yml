name: lint_python
on: [pull_request, push]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs reads the version from git tags
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # --locked fails the build if uv.lock and pyproject.toml have drifted,
      # rather than silently resolving something else. Only the extras this job
      # needs: ruff comes from test, mypy from dev, and the stubs from types.
      # --all-extras would additionally pull sphinx and twine's keyring and
      # cryptography chain into a job that only lints.
      - run: uv sync --locked --extra dev --extra test --extra types
      - run: uv run ruff format --check --diff .  # See pyproject.toml for configuration
      - run: uv run ruff check --output-format=github  # See pyproject.toml for configuration
      # Explicit targets, matching the pre-commit hook: `mypy .` walks whatever
      # is in the working tree, which differs between CI and a contributor's
      # checkout. See pyproject.toml for configuration.
      - run: uv run mypy internetarchive tests
