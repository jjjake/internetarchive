name: lint_python
on: [pull_request, push]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint_python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # hatch-vcs reads the version from git tags
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      # --locked fails the build if uv.lock and pyproject.toml have drifted,
      # rather than silently resolving something else.
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check --diff .  # See pyproject.toml for configuration
      - run: uv run ruff check --output-format=github  # See pyproject.toml for configuration
      # The pex requirements are not part of the locked project environment
      # (they pin the runtime set the pex bundles), so mypy needs them added on
      # top to type-check against what the binary actually ships.
      - run: uv pip install -r pex-requirements.txt
      - run: uv run mypy .  # See pyproject.toml for configuration
