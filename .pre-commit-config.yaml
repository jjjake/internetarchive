# To enable these pre-commit hook run:
# `python3 -m pip install pre-commit` or `brew install pre-commit`
# Then in the project root directory run `pre-commit install`
# Learn more about this config here: https://pre-commit.com/

# default_language_version:
#   python: python3.10

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-builtin-literals
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.1

    hooks:
      - id: ruff-check
        # args: [ --fix, --exit-non-zero-on-fix ]
      - id: ruff-format

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell  # See pyproject.toml for args

  # mypy runs from the locked project environment rather than from
  # mirrors-mypy, which would build its own environment with an independently
  # pinned mypy and a hand-copied stub list. Two required checks running two
  # mypy versions against two stub sets can disagree about the same file; this
  # way there is one mypy (uv.lock) and one stub list (the `types` extra).
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --locked --extra dev --extra types mypy
        language: system
        types: [python]
        pass_filenames: false
        # Explicit targets rather than `.`: mypy walks whatever is in the
        # working tree, so a local virtualenv sitting in the repo root breaks
        # the run. lint_python passes the same targets.
        args: ["internetarchive", "tests"]
