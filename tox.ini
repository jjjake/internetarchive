[tox]
envlist = py{310,311,312,313,314},pypy{311}

[testenv]
# Test dependencies come from the `test` extra in pyproject.toml rather than a
# separate requirements file, so there is one place to change them. tox
# resolves per interpreter, which is the point of running it -- so it does not
# use uv.lock, which pins a single resolution.
extras = test
# Linting/formatting is gated by the lint_python workflow and `make test`,
# not here — tox only runs the test suite across interpreters.
commands = pytest {posargs}
